name: Daily Auto Commit

on:
  schedule:
    - cron: '0 5 * * *'   # 10:30 AM IST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.name "avanishkasar"
          git config user.email "avanishkasar@gmail.com"

      - name: Run auto-commit engine
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: python .github/scripts/gha_commit.py
